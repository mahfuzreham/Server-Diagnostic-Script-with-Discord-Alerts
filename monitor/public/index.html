<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResellNom Server Monitor</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#e8ecf1}header{padding:18px 24px;background:#121a30;display:flex;justify-content:space-between}main{padding:24px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#121a30;border:1px solid #24304b;border-radius:12px;padding:18px}.grid{display:grid;grid-template-columns:1.4fr 2fr;gap:16px;margin-top:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #24304b}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}.ok{color:#48d597}.bad{color:#ff6b6b}.warn{color:#ffd166}pre{background:#080c16;padding:15px;min-height:350px;overflow:auto}input{padding:9px;border-radius:7px;border:1px solid #394866;background:#0b1020;color:white;width:100%;box-sizing:border-box;margin:5px 0}</style></head><body><header><b>RESELLNOM • SERVER MONITOR</b><span id="clock"></span></header><main><section class="cards"><div class="card">TOTAL<br><strong id="total">0</strong></div><div class="card">ONLINE<br><strong class="ok" id="online">0</strong></div><div class="card">OFFLINE<br><strong class="bad" id="offline">0</strong></div><div class="card">WARNING<br><strong class="warn" id="warning">0</strong></div></section><section class="grid"><div class="panel"><h3>Servers</h3><table><thead><tr><th>Server</th><th>Status</th><th>CPU</th><th>RAM</th><th>Disk</th><th></th></tr></thead><tbody id="servers"></tbody></table></div><div class="panel"><h3>Terminal</h3><small>SSH terminal is admin-only and uses the configured server key.</small><pre id="term">Select a server and click Terminal.</pre><input id="cmd" placeholder="Type command, then Enter"><button onclick="sendCmd()">Send</button></div></section></main><script>let token=localStorage.getItem('rn_token'),ws;const $=x=>document.getElementById(x);async function api(p,o={}){let r=await fetch('/api'+p,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(r.status===401){token=prompt('Admin JWT token');localStorage.setItem('rn_token',token);return api(p,o)}return r.json()}async function load(){let s=await api('/servers');$('total').textContent=s.length;$('online').textContent=s.filter(x=>x.online).length;$('offline').textContent=s.filter(x=>x.status==='offline').length;$('warning').textContent=s.filter(x=>x.status==='warning').length;$('servers').innerHTML=s.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.hostname)}</small></td><td class="${x.status==='online'?'ok':x.status==='warning'?'warn':'bad'}">${x.status}</td><td id="c${x.id}">-</td><td id="r${x.id}">-</td><td id="d${x.id}">-</td><td><button onclick="metrics(${x.id})">Monitor</button> <button onclick="terminal(${x.id})">Terminal</button></td></tr>`).join('');s.forEach(x=>metrics(x.id))}async function metrics(id){let a=await api('/servers/'+id+'/metrics');let x=a[a.length-1];if(x){$('c'+id).textContent=x.cpu.toFixed(1)+'%';$('r'+id).textContent=x.ram.toFixed(1)+'%';$('d'+id).textContent=x.disk.toFixed(1)+'%'}}function terminal(id){if(ws)ws.close();$('term').textContent='Connecting…';ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/terminal?server=${id}&token=${encodeURIComponent(token)}`);ws.onmessage=e=>{$('term').textContent+=e.data;$('term').scrollTop=$('term').scrollHeight};ws.onclose=()=>$('term').textContent+='\n[terminal closed]'}function sendCmd(){if(ws&&ws.readyState===1){let v=$('cmd').value+'\n';ws.send(v);$('cmd').value=''}}$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')sendCmd()});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}setInterval(()=>{$('clock').textContent=new Date().toLocaleString()},1000);load();setInterval(load,15000);</script></body></html>
